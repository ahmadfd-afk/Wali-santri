<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salam - Offline</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#04432A">
<style>
body { margin:0; font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#04432A,#0B6B46); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
.box { max-width:400px; }
img { width:120px; height:120px; border-radius:50%; border:3px solid #D4AF37; margin-bottom:20px; }
h1 { color:#D4AF37; margin-bottom:10px; }
p { line-height:1.6; opacity:0.9; }
button { margin-top:20px; padding:12px 24px; background:#D4AF37; color:#04432A; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:1rem; }
</style>
</head>
<body>
<div class="box">
<img src="icons/icon-192x192.png" alt="Salam">
<h1>🕌 Salam</h1>
<p>Anda sedang offline. Periksa koneksi internet Anda, lalu coba lagi.</p>
<p style="font-size:0.85rem; opacity:0.7; margin-top:15px;">Sistem Aplikasi Laporan Anak Mengaji</p>
<button onclick="location.reload()">🔄 Coba Lagi</button>
</div>
</body>
</html>
